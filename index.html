<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />

    <title>SCRS — Soft Computing Research Society | Official Club Website</title>

    <meta
      name="description"
      content="Official Website of SCRS (Soft Computing Research Society) - Student Chapter at KL University. Explore upcoming technical conclaves, hackathons, winner showcases, leadership team, and annual coordinator recruitment."
    />
    <meta
      name="keywords"
      content="SCRS, Soft Computing Research Society, KARE, KL University, student chapter, AI, machine learning, hackathons, coordinator recruitment"
    />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Soft Computing Research Society" />
    <meta
      property="og:title"
      content="SCRS — Soft Computing Research Society | Official Club Website"
    />
    <meta
      property="og:description"
      content="Explore upcoming technical conclaves, hackathons, winner showcases, student leadership directory, and coordinator applications."
    />
    <meta property="og:image" content="/logo.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SCRS — Soft Computing Research Society"
    />
    <meta
      name="twitter:description"
      content="Official KARE Student Chapter portal for research, events, hackathons, and coordinator recruitment."
    />
    <meta name="twitter:image" content="/logo.jpeg" />

    <!-- Google Fonts Preconnect & Display Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
